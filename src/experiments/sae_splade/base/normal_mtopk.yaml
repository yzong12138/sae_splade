id: sae_splade_mtopk
description: |
    Matryoshka TopK SAE training, then the SAE SPLADE training.

file: experiment
pythonpath: [../../..]
# module: src.sae_splade.topk_sae_distil_then_splade.experiment
gpu: true

logging: ["k", "splade_k"]

validation:
    size: 1000

train_config:
    sae:
        hf_id: ["distilbert/distilbert-base-uncased"]
        sae_width_list: [65536]
        layers: [-1]
        topk_style: "MTopK"
        ks: [32]
        norm_sae_input_opt: [False]
        sae_train_with_query_opt: [False]
        aux_rcst_coeff: [0.0625] # value is 0 for HTopK
    sae_splade:
        nway: 8
        d_flops: [0.04]
        q_flops: [0.06]
        flops_lambda_warmup: 6000
        override_k_option: [2, 4, 8, 16, 32, 65536]

learning:
    sae_optimization:
        scheduler: true
        steps_per_epoch: 400
        batch_size: 768
        max_epochs: 400
        weight_decay: 0.01
        lr: 5.0e-5
        eps: 6.0e-10
        num_warmup_steps: 10000
        warmup_min_factor: 1000
        # empty when freezing transformers
        re_no_l2_regularization: []

    ir_optimization:
        scheduler: true
        steps_per_epoch: 400
        batch_size: 32 # pairwise distillation
        max_epochs: 600
        weight_decay: 0.01
        lr: [2.0e-5]
        eps: 1.0e-8
        num_warmup_steps: 10000
        num_steps_to_decay: [10000]
        warmup_min_factor: [0]
        re_no_l2_regularization: []

    validation_interval: 20
    requirements: duration=6 days & cuda(mem=40G)
    validation_top_k: 50

retrieval:
    batch_size: 512 # maybe a little bit too large
    requirements: duration=2 days & cuda(mem=40G)

indexation:
    requirements: duration=1 days & cuda(mem=40G)
