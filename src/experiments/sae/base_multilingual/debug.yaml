id: sae_multilingual_experiment_debug
description: |
    multilingual SAE training.

file: experiment
pythonpath: [../../..]

gpu: true

validation:
    size: 10

train_config:
    ml_langs: ["fr", "zh"]
    sae:
        hf_id: ["distilbert/distilbert-base-multilingual-cased"]
        sae_width_list: [65536]
        layers: [-1]
        topk_style: "TopK"
        ks: [8]
        norm_sae_input_opt: [False]
        sae_train_with_query_opt: [False]
        aux_rcst_coeff: [0.0625]

learning:
    sae_optimization:
        scheduler: true
        steps_per_epoch: 10
        batch_size: 4
        max_epochs: 10
        weight_decay: 0.01
        lr: 5.0e-5
        eps: 6.0e-10
        num_warmup_steps: 20
        warmup_min_factor: 1000
        re_no_l2_regularization: []

    sample_rate: .01
    sample_max: 100_000
    validation_top_k: 20

    validation_interval: 5
    requirements: duration=2 days & cuda(mem=24G)

retrieval:
    batch_size: 8
    requirements: duration=2 days & cuda(mem=12G)

indexation:
    requirements: duration=1 days & cuda(mem=12G)
